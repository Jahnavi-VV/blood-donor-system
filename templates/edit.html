<!DOCTYPE html>
<html>
<head>
    <title>Edit Donor</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f4f4;
        }

        .container{
            width:450px;
            margin:40px auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        h2{
            text-align:center;
            color:#d32f2f;
        }

        input,select{
            width:100%;
            padding:10px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:5px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            background:#d32f2f;
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#b71c1c;
        }

    </style>

</head>

<body>

<div class="container">

<h2>Edit Donor</h2>

<form action="/update/{{ donor[0] }}" method="POST">

<input type="text" name="name" value="{{ donor[1] }}" required>

<input type="text" name="phone" value="{{ donor[3] }}" required>

<input type="text" name="city" value="{{ donor[4] }}" required>

<input type="number" name="age" value="{{ donor[5] }}" required>

<select name="availability">

<option value="Yes"
{% if donor[6]=='Yes' %}selected{% endif %}>
Yes
</option>

<option value="No"
{% if donor[6]=='No' %}selected{% endif %}>
No
</option>

</select>

<button type="submit">
Update Donor
</button>

</form>

</div>

</body>
</html>
