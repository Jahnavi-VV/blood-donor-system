<!DOCTYPE html>
<html>
<head>

    <title>Registration Successful</title>

    <style>

        body{
            font-family:Arial;
            background:#f5f5f5;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .receipt{
            background:white;
            padding:40px;
            width:420px;
            border-radius:15px;
            box-shadow:0px 0px 10px rgba(0,0,0,0.2);
            text-align:center;
        }

        .receipt img{
            width:250px;
            border-radius:10px;
            margin-bottom:20px;
        }

        h1{
            color:green;
        }

        .info{
            text-align:left;
            margin-top:20px;
        }

        .btn{
            display:inline-block;
            margin-top:20px;
            background:#d32f2f;
            color:white;
            padding:12px 20px;
            text-decoration:none;
            border-radius:5px;
        }

    </style>

</head>

<body>

    <div class="receipt">

        <!-- SUCCESS IMAGE -->
        <img src="/static/images/success.jpeg">
        
        <h1>✅ Registration Successful</h1>

        <p>
            Thank you for registering as a blood donor ❤️
        </p>

        <div class="info">

            <p><b>Name:</b> {{ name }}</p>

            <p><b>Blood Group:</b> {{ blood_group }}</p>

            <p><b>City:</b> {{ city }}</p>

        </div>

        <a href="/" class="btn">
            Back to Home
        </a>

    </div>

</body>
</html>
