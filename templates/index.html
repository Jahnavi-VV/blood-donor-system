<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blood Donor System</title>

    <style>

        body{
            font-family: Arial;
            margin:0;
            padding:0;
            background-image:url("/static/images/blood.JPG");
            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;
            background-attachment:fixed;
        }

        header{
            background-color:#d32f2f;
            color:white;
            text-align:center;
            padding:20px;
        }

        .container{
            width:50%;
            margin:30px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 10px rgba(0,0,0,0.2);
        }

        h2{
            color:#d32f2f;
        }

        .form-group{
            margin-bottom:15px;
        }

        label{
            display:block;
            margin-bottom:5px;
            font-weight:bold;
        }

        input, select{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:5px;
            box-sizing:border-box;
        }

        button{
            background:#d32f2f;
            color:white;
            padding:12px;
            border:none;
            width:100%;
            font-size:16px;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#b71c1c;
        }

        hr{
            margin:40px 0;
        }

    </style>

</head>

<body>

<header>
    <h1>Blood Donor Management System</h1>
    <p>Save Lives ❤️</p>
</header>

<div class="container">

    <!-- Registration -->

    <h2>Donor Registration</h2>

    <form action="/register" method="POST">

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required>
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input type="text" name="phone" required>
        </div>

        <div class="form-group">
            <label>Date of Birth</label>
            <input type="date" name="dob" required>
        </div>

        <div class="form-group">
            <label>Blood Group</label>

            <select name="blood_group" required>
                <option>O+</option>
                <option>O-</option>
                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>AB+</option>
                <option>AB-</option>
            </select>
        </div>

        <div class="form-group">
            <label>City</label>
            <input type="text" name="city" required>
        </div>

        <div class="form-group">
            <label>Age</label>
            <input type="number" name="age" required>
        </div>

        <div class="form-group">
            <label>Availability</label>

            <select name="availability">
                <option>Yes</option>
                <option>No</option>
            </select>
        </div>

        <button type="submit">
            Register Donor
        </button>

    </form>

    <hr>

    <!-- Search by Blood Group -->

    <h2>🩸 Search by Blood Group</h2>

    <form action="/search_blood" method="GET">

        <div class="form-group">

            <label>Blood Group</label>

            <select name="blood_group" required>

                <option>O+</option>
                <option>O-</option>
                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>AB+</option>
                <option>AB-</option>

            </select>

        </div>

        <button type="submit">
            Search Blood Group
        </button>

    </form>

    <hr>

    <!-- Search by City -->

    <h2>📍 Search by City</h2>

    <form action="/search_city" method="GET">

        <div class="form-group">

            <label>City</label>

            <input type="text" name="city" placeholder="Enter City" required>

        </div>

        <button type="submit">
            Search City
        </button>

    </form>

    <hr>

    <!-- Advanced Search -->

    <h2>Search by blood group and city</h2>

    <form action="/search" method="GET">

        <div class="form-group">

            <label>Blood Group</label>

            <select name="blood_group">

                <option>O+</option>
                <option>O-</option>
                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>AB+</option>
                <option>AB-</option>

            </select>

        </div>

        <div class="form-group">

            <label>City</label>

            <input type="text" name="city" placeholder="Enter City" required>

        </div>

        <button type="submit">
            Search Blood Group + City
        </button>

    </form>

</div>

</body>
</html>
